name: restore source
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-binaries.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the game source
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/d20-source.tar.gz \
            "https://tmpfiles.org/dl/1790609192.18a2f4b56c04a4d6/wCAYw7nKvK6X/d20-source.tar.gz"
          test "$(tar -tzf /tmp/d20-source.tar.gz | wc -l)" -eq 76
          tar -xzf /tmp/d20-source.tar.gz
          rm -f docs/bin-test.bin
          git checkout -- docs/videos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add the living-room table source"
          git push
