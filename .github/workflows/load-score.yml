name: load score
on:
  push:
    paths:
      - .github/workflows/load-score.yml
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the score, its composer and the TV wiring
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/d20-score.tar.gz \
            "https://tmpfiles.org/dl/1790614935.b7e12c949500847c/wvA3wdVRydFp/d20-score.tar.gz"
          echo "ae80c6a13eca6bf5a311941c90c89ef636a5dd39504a65127878f85931980a84  /tmp/d20-score.tar.gz" | sha256sum -c -
          tar -xzf /tmp/d20-score.tar.gz
          git rm -q .github/workflows/load-score.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add the Luppolandia score, its composer and the TV music director"
          git push
