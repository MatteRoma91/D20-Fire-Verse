name: Sync the AAA table snapshot

on:
  push:
    branches: [main]
    paths: [".github/workflows/sync-aaa-snapshot.yml"]

permissions:
  contents: write

concurrency:
  group: sync-aaa-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download and verify the snapshot
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local page="$1" out="$2" sum="$3" real=""
            for attempt in 1 2 3 4; do
              real=$(curl -fsSL "$page" | grep -oE 'https://tmpfiles.org/dl/[0-9.a-f]+/[^"]+' | head -1 || true)
              if [ -n "$real" ] && curl -fsSL --retry 3 -o "$out" "$real" && echo "$sum  $out" | sha256sum -c -; then return 0; fi
              sleep $((attempt * 5))
            done
            echo "Could not fetch a verified copy of $page" >&2
            return 1
          }
          fetch "https://tmpfiles.org/wwAdwZJH07zg/src.tgz" "$RUNNER_TEMP/src.tgz" "2ab73063504b93962223427d7a78b3caf8172ef7a56e63035af94953635f4417"
          fetch "https://tmpfiles.org/wyAuwgJl04Ra/aaa_highlights.mp4" "$RUNNER_TEMP/aaa_highlights.mp4" "5b8a6cd75c8430f34def20d356362ecc670d72ba7f095e3514702bd03361001b"
          fetch "https://tmpfiles.org/wbA6w8Jl0PrD/aaa_remote_only_walkthrough.mp4" "$RUNNER_TEMP/aaa_remote_only_walkthrough.mp4" "068a61764837875e0d980614a62c04a2480b584140e3f69435ed6fb03530b53b"
      - name: Mirror the tree (workflow files stay as they are)
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/src.tgz" --exclude='.github'
          mkdir -p docs/videos
          mv "$RUNNER_TEMP/aaa_highlights.mp4" "$RUNNER_TEMP/aaa_remote_only_walkthrough.mp4" docs/videos/
          git status --short -- .github
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ship the AAA living-room table: remote-first play, staged combat, 3D d20, neural narrator, SFX, companion seats, accessibility, and remote-only walkthroughs"
          git push origin HEAD:main
