name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NARRATION: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Rules tests
        run: npm test
      - name: Build TV and companion
        run: npm run build

  firetv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firetv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Lint and build the Fire TV app
        run: ./gradlew --no-daemon lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: d20-fireverse-firetv
          path: firetv/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
