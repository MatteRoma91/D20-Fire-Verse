name: Sync the NPC voices and Fire TV snapshot

on:
  push:
    branches: [main]
    paths: [".github/workflows/sync-voices-firetv.yml"]

permissions:
  contents: write

concurrency:
  group: sync-voices-firetv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download and verify the snapshot
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local page="$1" out="$2" sum="$3" real=""
            for attempt in 1 2 3 4; do
              real=$(curl -fsSL "$page" | grep -oE 'https://tmpfiles.org/dl/[0-9.a-f]+/[^"]+' | head -1 || true)
              if [ -n "$real" ] && curl -fsSL --retry 3 -o "$out" "$real" && echo "$sum  $out" | sha256sum -c -; then return 0; fi
              sleep $((attempt * 5))
            done
            echo "Could not fetch a verified copy of $page" >&2
            return 1
          }
          fetch "https://tmpfiles.org/w8AMwqtOMEYd/src.part.00" "$RUNNER_TEMP/src.part.00" "7ccea710eb7167f3536f0794832ac6bd0dd5ccb0136b92b7afdc754ccd81083b"
          fetch "https://tmpfiles.org/wXAwwDtjMczp/src.part.01" "$RUNNER_TEMP/src.part.01" "258f3d5e8ff4a0e4631ddba81cee697d5d13e8b10dc0be144afa987f597ed45a"
          cat "$RUNNER_TEMP/src.part.00" "$RUNNER_TEMP/src.part.01" > "$RUNNER_TEMP/src.tgz"
          echo "c0cde8fa6e80df879e77ef641d9480ec130b36012b89d9239e737bc8e129e51c  $RUNNER_TEMP/src.tgz" | sha256sum -c -
          fetch "https://tmpfiles.org/wBAqw2tkM1Ts/npc_voices_demo.mp4" "$RUNNER_TEMP/npc_voices_demo.mp4" "8e6e8f3636c560a4eeeeeca0948a8aa42635db0cd003a4c917ed677c8d2a78b7"
      - name: Mirror the tree (workflow files and earlier videos stay)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/videos"
          if [ -d docs/videos ]; then cp -a docs/videos/. "$RUNNER_TEMP/videos/"; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/src.tgz" --exclude='.github'
          mkdir -p docs/videos
          cp -a "$RUNNER_TEMP/videos/." docs/videos/
          mv "$RUNNER_TEMP/npc_voices_demo.mp4" docs/videos/
          ls -la docs/videos releases/firetv
          git status --short -- .github
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Give every NPC a voice of their own and ship the Fire TV app (signed APK 1.0.0), with a remote-only voices walkthrough"
          git push origin HEAD:main
